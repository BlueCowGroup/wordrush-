<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Full background for maskable (safe zone is 80% center) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Speech bubble (scaled down and centered for safe zone) -->
  <path d="M137 193 Q137 150 180 150 L332 150 Q375 150 375 193 L375 280 Q375 323 332 323 L227 323 L183 367 L194 323 L180 323 Q137 323 137 280 Z"
        fill="url(#bubbleGrad)"
        stroke="#4f46e5"
        stroke-width="6"/>

  <!-- Letter W -->
  <text x="256" y="273"
        font-family="Arial Black, Arial, sans-serif"
        font-size="110"
        font-weight="900"
        fill="#6366f1"
        text-anchor="middle">W</text>

  <!-- Speed lines -->
  <line x1="100" y1="207" x2="122" y2="207" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="90" y1="240" x2="118" y2="240" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="100" y1="273" x2="122" y2="273" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>

  <!-- Timer accent -->
  <circle cx="390" cy="167" r="26" fill="#fbbf24"/>
  <path d="M390 150 L390 167 L402 174" stroke="#0f0f23" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
