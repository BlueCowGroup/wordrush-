<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="96" cy="96" r="88" fill="url(#bgGrad)"/>

  <!-- Speech bubble -->
  <path d="M40 65 Q40 45 60 45 L132 45 Q152 45 152 65 L152 105 Q152 125 132 125 L85 125 L65 145 L70 125 L60 125 Q40 125 40 105 Z"
        fill="url(#bubbleGrad)"
        stroke="#6366f1"
        stroke-width="3"/>

  <!-- Letter W -->
  <text x="96" y="100"
        font-family="Arial Black, Arial, sans-serif"
        font-size="52"
        font-weight="900"
        fill="#6366f1"
        text-anchor="middle">W</text>

  <!-- Speed lines (representing Rush) -->
  <line x1="25" y1="70" x2="35" y2="70" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="85" x2="33" y2="85" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="100" x2="35" y2="100" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <!-- Timer accent -->
  <circle cx="155" cy="55" r="12" fill="#fbbf24"/>
  <path d="M155 48 L155 55 L160 58" stroke="#0f0f23" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
